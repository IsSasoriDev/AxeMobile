version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: axemobile-main_web_1
      APP_PORT: 3847

  web:
    image: ghcr.io/issasoridev/axemobile:2.0.0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      AXEMOBILE_DATA: /data
      AXEMOBILE_PORT: 3847
