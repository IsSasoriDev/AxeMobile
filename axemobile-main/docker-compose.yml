version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: axemobile-main_web_1
      APP_PORT: 3847

  web:
    image: ghcr.io/issasoridev/axemobile:2.1.0@sha256:628d87c7707cacce8c7f173c167fd540fe31a4df62693bcb8781271fa60df7aa
    # no `user:` here on purpose: the image starts as root only long enough
    # to fix the ownership of /data, then drops to 1000:1000 (see entrypoint.sh)
    init: true
    restart: on-failure
    stop_grace_period: 1m
    ports:
      # AxePool stratum, for the miners on your network
      - "3334:3334"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      AXEMOBILE_DATA: /data
      AXEMOBILE_PORT: 3847
      # AxePool gets its block templates from the Bitcoin Node app
      AXEMOBILE_NODE_URL: "http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}"
      AXEMOBILE_NODE_USER: "${APP_BITCOIN_RPC_USER}"
      AXEMOBILE_NODE_PASS: "${APP_BITCOIN_RPC_PASS}"
      AXEMOBILE_POOL_PORT: 3334
      AXEMOBILE_POOL_ENABLED: "1"
      AXEMOBILE_POOL_HOST: "${DEVICE_DOMAIN_NAME}"
