version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: axemobile-main_web_1
      APP_PORT: 3847

  web:
    image: ghcr.io/issasoridev/axemobile:2.1.0
    # no `user:` here on purpose: the image starts as root only long enough
    # to fix the ownership of /data, then drops to 1000:1000 (see entrypoint.sh)
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      AXEMOBILE_DATA: /data
      AXEMOBILE_PORT: 3847
