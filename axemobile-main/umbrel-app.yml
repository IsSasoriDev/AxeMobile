releaseNotes: >-
  AxeMobile 2.0 is a rewrite.


  - New engine written in Rust with its own SQLite database. It reads your
  miners every few seconds, keeps two days of detail and a year of hourly
  averages.

  - Supports AxeForge and AxeOS miners, including AxeForge two-factor login.

  - New dashboard modelled on the AxeForge firmware page: fleet gauge,
  history charts, pools, tuning and system pages.

  - Alerts for overheating, hashrate drops, offline miners and new best
  shares in the activity log.

  - News, forum and the old online services are gone. Nothing leaves your
  Umbrel except the optional price lookup on mempool.space.
