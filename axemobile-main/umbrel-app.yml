  - 3.jpg
  - 4.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  Fleet health, reports and bulk actions.


  - Every miner gets a health score and a list of what's wrong: hashrate
  below expected, rejected shares, heat, a hot voltage regulator, low input
  voltage, weak Wi-Fi, no pool, or rebooting on its own. The dashboard lists
  the miners that need a look.

  - Uptime for the last 24 hours, 7 days and 30 days, and a count of reboots
  nobody asked for.

  - New Reports page: hashrate, energy, cost, shares, uptime and reboots per
  day and per miner, for 7, 30 or 90 days, with CSV downloads.

  - AxeMobile checks GitHub for new AxeForge, AxeOS and NerdQAxe firmware and
  marks miners that are behind. You can turn this off in System.

  - Tick several miners on the Swarm page to restart them or give them all
  the same pool, each with its own worker name.
