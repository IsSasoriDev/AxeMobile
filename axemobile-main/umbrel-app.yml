manifestVersion: 1
id: axemobile-main
storage:
  dataRoot: data
category: bitcoin
name: AxeMobile
version: "2.2.0"
tagline: Watch, tune and solo mine with your Bitaxe and NerdQaxe miners
description: >-
  AxeMobile keeps an eye on your home Bitcoin miners from your Umbrel. It
  talks to miners running AxeForge or the stock AxeOS firmware over your
  local network and keeps their history in its own database, so the charts
  are still there after a miner reboots.


  What you get:

  - Fleet dashboard with total hashrate, power, efficiency and best share

  - Per-miner pages with hashrate, temperature and power history

  - Pool setup for each miner, with failover or split by weight on AxeForge,
  and copying one pool setup to several miners at once

  - Clock, voltage, fan and auto-tune settings

  - Network scan to find miners, plus importing an AxeForge miner's swarm

  - Activity log: miners going offline, restarts, new best shares, blocks

  - Bitcoin price, fees and your solo odds

  - Leaderboard of the biggest shares your fleet has found

  - AxePool, a solo pool on your own Bitcoin node: point your miners at
  your Umbrel on port 3334 and a block found pays the full reward to your
  address

  - The DTV Electronics theme


  Getting started: open AxeMobile, go to Swarm, and add a miner by its IP
  address or scan your subnet (for example 192.168.1). For solo mining, open
  AxePool once your Bitcoin node is in sync.
developer: IsSasoriDev
website: https://github.com/IsSasoriDev/AxeMobile
dependencies:
  - bitcoin
repo: https://github.com/IsSasoriDev/AxeMobile
support: https://github.com/IsSasoriDev/AxeMobile/issues
port: 3847
icon: https://raw.githubusercontent.com/IsSasoriDev/AxeMobile/main/axemobile-main/icon.png
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  AxePool: solo mining on your own Bitcoin node.


  - AxeMobile now needs the Bitcoin Node app. AxePool takes its block
  templates from it, with nothing to set up.

  - Point your miners at your Umbrel's IP address on port 3334, with your
  Bitcoin address as the username. If one of them finds a block, the full
  reward goes to that address.

  - The AxePool page shows each worker's hashrate, shares and best share,
  your odds of finding a block, and any blocks found. It can also switch a
  miner over to AxePool for you.
