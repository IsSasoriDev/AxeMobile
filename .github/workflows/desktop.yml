name: Desktop builds

# Builds AxeMobile for Windows (installer), macOS (DMG with the widget) and
# Linux (.deb + .tar.gz). Every run uploads the files as artifacts; a
# published release also gets them attached.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packaging/**"
      - "scripts/build-windows.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "crates/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # set on a published release, or by hand when re-running for an existing one
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p axe-core -p axe-desktop
      - name: Build app and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AxeMobile-Windows
          path: dist-win/*.exe
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" (Get-ChildItem dist-win/AxeMobile-Setup-*.exe).FullName --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: cargo test -p axe-core -p axe-desktop
      - name: Build app, widget and DMG
        env:
          MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
        run: bash packaging/macos/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AxeMobile-macOS
          path: dist-mac/*.dmg
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist-mac/*.dmg --clobber

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libdbus-1-dev pkg-config
      - name: Test
        run: cargo test -p axe-core -p axe-desktop
      - name: Build .deb and .tar.gz
        run: bash packaging/linux/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AxeMobile-Linux
          path: |
            dist-linux/*.deb
            dist-linux/*.tar.gz
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist-linux/*.deb dist-linux/*.tar.gz --clobber
